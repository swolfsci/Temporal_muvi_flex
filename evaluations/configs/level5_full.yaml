name: level5_full
level: 5
n_seeds: 5

data:
  n_patients: 80
  n_timepoints: 8
  n_views: 2
  n_features: [300, 200]
  n_temporal_factors: 3
  n_iid_factors: 3
  lengthscales: [2.0, 5.0, 10.0]
  use_prior_masks: true
  n_active_features_per_factor: 30
  prior_noise_fraction: 0.15
  n_covariates: 2
  covariate_types: [binary, binary]
  covariate_names: [sex, treatment]
  dynamic_covariates: [1]
  dynamic_effect_magnitude: 1.5
  beta_sparsity: 0.8
  noise_std: 0.5
  missing_rate: 0.3
  min_observations: 3
  time_points: [0, 1, 3, 7, 14, 21, 30, 60]

model:
  use_prior_masks: true
  use_covariates: true
  n_dense_factors: 3
  kernel: matern32

training:
  n_epochs: 3000
  learning_rate: 0.01
  early_stopping: true
  patience: 30
  min_epochs: 200
