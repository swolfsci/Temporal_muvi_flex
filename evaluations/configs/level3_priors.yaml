name: level3_priors
level: 3
n_seeds: 5

data:
  n_patients: 50
  n_timepoints: 6
  n_views: 2
  n_features: [200, 150]
  n_temporal_factors: 2
  n_iid_factors: 2
  lengthscales: [2.0, 6.0]
  use_prior_masks: true
  n_active_features_per_factor: 30
  prior_noise_fraction: 0.0
  noise_std: 0.5
  missing_rate: 0.0

model:
  use_prior_masks: true
  n_dense_factors: 2
  kernel: matern32

training:
  n_epochs: 5000
  learning_rate: 0.01
  early_stopping: true
  patience: 100
  min_epochs: 500

sweep:
  prior_noise_fraction: [0.0, 0.1, 0.3, 0.5]
