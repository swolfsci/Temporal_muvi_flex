name: level2_temporal
level: 2
n_seeds: 5

data:
  n_patients: 50
  n_timepoints: 8
  n_views: 2
  n_features: [200, 150]
  n_temporal_factors: 2
  n_iid_factors: 2
  lengthscales: [2.0, 6.0]
  noise_std: 0.5
  missing_rate: 0.0

model:
  n_dense_factors: 4
  kernel: matern32

training:
  n_epochs: 5000
  learning_rate: 0.01
  early_stopping: true
  patience: 100
  min_epochs: 500

sweep:
  noise_std: [0.3, 0.5, 1.0]
