name: sweep_missingness
level: 5
n_seeds: 5

data:
  n_patients: 80
  n_timepoints: 8
  n_views: 2
  n_features: [300, 200]
  n_temporal_factors: 3
  n_iid_factors: 3
  lengthscales: [2.0, 5.0, 10.0]
  use_prior_masks: true
  prior_noise_fraction: 0.15
  n_covariates: 2
  covariate_types: [binary, binary]
  covariate_names: [sex, treatment]
  dynamic_covariates: [1]
  noise_std: 0.5
  missing_rate: 0.0
  time_points: [0, 1, 3, 7, 14, 21, 30, 60]

model:
  use_prior_masks: true
  use_covariates: true
  n_dense_factors: 3
  kernel: matern32

training:
  n_epochs: 5000
  learning_rate: 0.01
  early_stopping: true
  patience: 100
  min_epochs: 500

sweep:
  missing_rate: [0.0, 0.1, 0.3, 0.5]
